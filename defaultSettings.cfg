[video]

resolution=Vector2i(1080, 1920)
fullscreen=false
borderless=false
vsync=true

[audio]

volume_master=100
volume_music=50
volume_sfx=50

[gamepad_controls]

controller_move_up="JOY_AXIS_LEFT_Y -"
controller_move_down="JOY_AXIS_LEFT_Y +"
controller_move_right="JOY_AXIS_LEFT_X -"
controller_move_left="JOY_AXIS_LEFT_X +"
controller_action_right="JOY_BUTTON_B"
controller_action_bottom="JOY_BUTTON_A"
controller_action_top="JOY_BUTTON_Y"
controller_action_left="JOY_BUTTON_X"
controller_start="JOY_BUTTON_START"
controller_select="JOY_BUTTON_SELECT"

[mobile_controls]

mobile_move_up="JOY_AXIS_LEFT_Y -"
mobile_move_down="JOY_AXIS_LEFT_Y +"
mobile_move_right="JOY_AXIS_LEFT_X -"
mobile_move_left="JOY_AXIS_LEFT_X +"
mobile_action_right="JOY_BUTTON_B"
mobile_action_bottom="JOY_BUTTON_A"
mobile_action_top="JOY_BUTTON_Y"
mobile_action_left="JOY_BUTTON_X"
mobile_start="JOY_BUTTON_START"
mobile_select="JOY_BUTTON_SELECT"

[mk_controls]

mk_move_up="Z"
mk_move_down="S"
mk_move_right="D"
mk_move_left="Q"
mk_action_right="KEY_SPACE"
mk_action_bottom="MOUSE_BUTTON_LEFT"
mk_action_top="MOUSE_BUTTON_RIGHT"
mk_action_left="MOUSE_BUTTON_MIDDLE"
mk_start="KEY_ENTER"
mk_select="KEY_ESCAPE"

[language]

locale="en"
